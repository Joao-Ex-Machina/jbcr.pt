baseURL = 'https://jbcr.pt/'
languageCode = 'en-us'
title = "João Rodrigues' Slick Site"

theme = 'lugo_2'

[markup]
  [markup.highlight]
    noClasses = true      # Use CSS classes for styling
    style = "gruvbox"       # Choose a color scheme (e.g., "dracula", "monokai", etc.)
    lineNos = false          # Show line numbers if desired
    lineNumbersInTable = true # Places line numbers in a table
   [markup.goldmark.renderer]
     unsafe = true

# Also expose the photos as assets so the gallery can generate resized copies
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/photos"
    target = "assets/photos"
